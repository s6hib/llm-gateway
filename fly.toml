# Fly.io settings. `fly launch --no-deploy --copy-config --ha=false` creates the
# app from this file; `fly deploy` builds the Dockerfile and starts it.
app = "llm-g8way"
primary_region = "iad"

[env]
  ADDR = "0.0.0.0:8080"
  SPEND_FILE = "/data/spend.json"
  # Each gateway key may spend this many dollars a day.
  DAILY_CAP_USD = "0.25"

# One machine that stops when no requests are coming in and starts again on the
# next one, which then waits a couple of seconds. The rate limit, the cache and
# the stats are kept in memory, so they start empty after each stop. The day's
# spend is on the disk below and is not lost.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# A small disk for spend.json, so a stop, deploy or restart does not reset the
# day's totals.
[mounts]
  source = "gateway_data"
  destination = "/data"
  initial_size = "1gb"
